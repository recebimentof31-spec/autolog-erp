<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLog ERP</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-box">

    <div class="logo">
        AUTOLOG
        <span>ERP LOGÍSTICA</span>
    </div>

    <h2>Bem-vindo</h2>

    <input
        type="text"
        id="usuario"
        placeholder="Usuário">

    <input
        type="password"
        id="senha"
        placeholder="Senha">

    <button onclick="login()">
        Entrar
    </button>

    <p id="mensagem"></p>

</div>

<script src="js/app.js"></script>

</body>
</html>
