<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestão de Desempenho - Avaliações</title>

<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <h2>📊 Gestão de Desempenho</h2>

        <nav>

            <a href="dashboard.html">🏠 Dashboard</a>

            <a href="funcionarios.html">👥 Funcionários</a>

            <a href="avaliacoes.html" class="active">📝 Avaliações</a>

            <a href="ranking.html">🏆 Ranking</a>

            <a href="relatorios.html">📈 Relatórios</a>

            <a href="configuracoes.html">⚙ Configurações</a>

        </nav>

    </aside>

    <main class="content">

       <h1>Avaliação Semanal</h1>

<div class="card">

    <div class="form-grid">

        <div>
            <label>Funcionário</label>
            <select id="funcionario"></select>
        </div>

        <div>
            <label>Semana</label>
            <select id="semana">
                <option>Semana 1</option>
                <option>Semana 2</option>
                <option>Semana 3</option>
                <option>Semana 4</option>
                <option>Semana 5</option>
            </select>
        </div>

    </div>

</div>

<br>

  <div class="card">

    <h2>Critérios de Avaliação</h2>

    <div class="criterio">
        <label>Produtividade</label>
        <input type="range" id="produtividade" min="0" max="15" value="15">
        <span id="produtividadeValor">15</span>
    </div>

    <div class="criterio">
        <label>Prazo</label>
        <input type="range" id="prazo" min="0" max="10" value="10">
        <span id="prazoValor">10</span>
    </div>

    <div class="criterio">
        <label>Qualidade</label>
        <input type="range" id="qualidade" min="0" max="15" value="15">
        <span id="qualidadeValor">15</span>
    </div>

    <div class="criterio">
        <label>Conhecimento técnico</label>
        <input type="range" id="conhecimentoTecnico" min="0" max="15" value="15">
        <span id="conhecimentoTecnicoValor">15</span>
    </div>

    <div class="criterio">
        <label>Proatividade</label>
        <input type="range" id="proatividade" min="0" max="10" value="10">
        <span id="proatividadeValor">10</span>
    </div>

    <div class="criterio">
        <label>Trabalho em equipe</label>
        <input type="range" id="trabalhoEquipe" min="0" max="15" value="15">
        <span id="trabalhoEquipeValor">15</span>
    </div>

    <div class="criterio">
        <label>Adaptabilidade</label>
        <input type="range" id="adaptabilidade" min="0" max="10" value="10">
        <span id="adaptabilidadeValor">10</span>
    </div>

    <div class="criterio">
        <label>Responsabilidade</label>
        <input type="range" id="responsabilidade" min="0" max="10" value="10">
        <span id="responsabilidadeValor">10</span>
    </div>

</div>

</div>

<br>

<div class="card">

<h2>Resultado</h2>

<h1 id="notaFinal">100</h1>

<div id="classificacao" style="
    margin: 8px 0 16px;
    font-size: 20px;
    font-weight: 700;
">
    🟢 EXCELENTE
</div>

<button id="salvar">Salvar Avaliação</button>

</div>

  

    </main>

</div>

<script src="js/avaliacoes.js"></script>

</body>
</html>
